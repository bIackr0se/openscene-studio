name: Release gate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify release candidate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CI: true
      OPENSCENE_PRODUCTION_TEST_PORT: 4175
    steps:
      - name: Check out source
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Use Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22.22.0
          cache: npm

      - name: Install media tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg lsof libdigest-sha-perl

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run the complete release boundary
        run: npm run verify:local-release

      - name: Retain browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-failure-evidence
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
